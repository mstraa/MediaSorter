name: CI

# Builds and tests the server crate plus the frontend on every push and PR.
# The release workflow only fires on a tag and only builds the desktop app, so
# without this nothing checks the code that actually runs on the LXC.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # The build must stay warning-free; it is today, so keep it that way.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend

  # The production artifact is the frontend bundle embedded in the binary, so
  # verify that whole path rather than the two halves separately.
  embedded-release-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: npm ci && npm run build
        working-directory: frontend

      - name: Build release binary
        run: cargo build --release

      - name: Smoke-test the binary
        run: |
          TVSORTER_DATA_DIR=$(mktemp -d) TVSORTER_HOST=127.0.0.1 TVSORTER_PORT=8080 \
            ./target/release/tvsorter &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          echo "server did not become healthy" >&2
          exit 1
